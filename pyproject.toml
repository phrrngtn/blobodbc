[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blobodbc"
version = "0.2.2"
description = "ODBC query execution returning JSON, as scalar functions for SQLite, DuckDB, and Python"
# 3.11 for the `X | None` annotations in the ctypes layer.
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Paul Harrington"}]
# blobzig is the family's shared ctypes plumbing — pure Python.
dependencies = ["blobzig"]

[project.urls]
Repository = "https://github.com/phrrngtn/blobodbc"

[tool.hatch.build.targets.wheel]
packages = ["python/blobodbc"]

# hatch_build.py stamps the platform tag and picks which of zig-out/lib
# belongs in this wheel — that directory keeps artifacts from every target.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
blobzig = { path = "../blobzig", editable = true }
