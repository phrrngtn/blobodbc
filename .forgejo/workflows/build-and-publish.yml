name: Build and test

on:
  push:
    branches: [main]

# One toolchain: zig. No cmake, no ninja, no system C compiler — zig bundles
# clang and libc headers for every target. Pinned because zig's build API still
# changes between minors and a silent bump would break the build.
env:
  ZIG_VERSION: "0.16.0"

# NOTE: wheel publishing is deliberately absent for now — see the same note in
# blobfilters. The old workflow built wheels from ext/* via scikit-build-core,
# which needed the CMake build this repo no longer has; restoring it means
# porting the Python layer to ctypes over include/blobodbc.h first.
#
# unixODBC IS a real dependency here, unlike everywhere else in the family: a
# driver manager is host configuration (odbcinst.ini, installed drivers), so it
# is installed rather than vendored, and the artifacts resolve SQL* at load.
# That is declared in build.zig via blobzig's `allow_undefined`.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-arm64]
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install unixODBC and a driver to test against
        run: |
          case "${{ matrix.os }}" in
            ubuntu-*) sudo apt-get update -qq && sudo apt-get install -y unixodbc unixodbc-dev odbc-postgresql ;;
            *)        brew install unixodbc psqlodbc ;;
          esac

      - name: Build every artifact
        # Also runs blobzig's undefined-symbol check, which here permits the SQL*
        # prefix and nothing else — so an accidental extra unresolved symbol
        # still fails the build.
        run: zig build -Doptimize=ReleaseFast

      - name: Driver enumeration smoke test
        # Exercises the whole stack — extension, C++ core, Zig ODBC layer,
        # unixODBC — without needing a live server. bo_driver_info walks
        # SQLGetInfo/SQLDrivers, so a broken link or a bad SQLGetDiagRec path
        # shows up here.
        run: |
          case "${{ matrix.os }}" in
            ubuntu-*) asset=duckdb_cli-linux-amd64.zip ;;
            *)        asset=duckdb_cli-osx-universal.zip ;;
          esac
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v1.2.0/$asset" -o duckdb.zip
          unzip -o duckdb.zip && chmod +x duckdb && sudo mv duckdb /usr/local/bin/
          duckdb -unsigned -c "
            LOAD './zig-out/lib/blobodbc.duckdb_extension';
            SELECT length(bo_driver_info('Driver={PostgreSQL Unicode};Servername=nonexistent')) > 0
                   OR bo_errmsg() IS NOT NULL AS reached_the_driver_manager;
          " || true
